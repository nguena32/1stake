name: Deploy 1stake

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSW }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .env*
            !.env.example
            storage/logs/**/*.log
            storage/temp/**
            storage/backups/**
            storage/private-media/**
            .vscode/**
            .idea/**
            **/.DS_Store
            **/Thumbs.db
            **/desktop.ini
            stitch_landing_page_afrocalis/**
            stitch_landing_page_afrocalis_mobile/**
            maquettes01/**

